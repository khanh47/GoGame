name: Build and Deploy

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows Version
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-raylib
          make
    
    - name: Build Windows executable
      shell: msys2 {0}
      run: |
        make clean
        make run.exe
    
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: GoGame-Windows
        path: |
          run.exe
          assets/
          README.md

  build-web:
    name: Build Web Version
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: 'latest'
    
    - name: Verify Emscripten
      run: emcc --version
    
    - name: Build for Web
      run: |
        # Build web version with custom shell template
        emcc -std=c++20 \
          -Iinclude \
          -Iinclude/Scene \
          -Iinclude/GameStates \
          -Iinclude/Menu \
          -Iinclude/Game \
          -Iinclude/AI \
          -Iinclude/GameData \
          -Iinclude/Resource \
          -Iinclude/Commands \
          -Iinclude/Render/InGame \
          -Iinclude/Render/Settings \
          -Iinclude/Menu/MenuComponent \
          -Iinclude/Menu/MenuView \
          -Iinclude/Menu/MenuController \
          -Iinclude/Scene/ConcreteScene \
          -Iinclude/GameStates/ConcreteGameStates \
          -O3 \
          -s USE_GLFW=3 \
          -s ASYNCIFY \
          -s TOTAL_MEMORY=67108864 \
          -s ALLOW_MEMORY_GROWTH=1 \
          --preload-file assets \
          --shell-file web/shell.html \
          src/*.cpp \
          src/*/*.cpp \
          src/*/*/*.cpp \
          -o gogame.html
    
    - name: Create index redirect
      run: |
        echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url=gogame.html"></head><body>Redirecting...</body></html>' > index.html
    
    - name: Upload Web artifact
      uses: actions/upload-artifact@v4
      with:
        name: GoGame-Web
        path: |
          gogame.html
          gogame.js
          gogame.wasm
          gogame.data
          index.html
    
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-web
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-web]
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: GoGame-Windows
        path: windows-build
    
    - name: Download Web artifact
      uses: actions/download-artifact@v4
      with:
        name: GoGame-Web
        path: web-build
    
    - name: Create Windows package
      run: |
        cd windows-build
        zip -r ../GoGame-Windows-${{ github.ref_name }}.zip .
    
    - name: Create Web package
      run: |
        cd web-build
        zip -r ../GoGame-Web-${{ github.ref_name }}.zip .
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          GoGame-Windows-${{ github.ref_name }}.zip
          GoGame-Web-${{ github.ref_name }}.zip
        body: |
          # GoGame ${{ github.ref_name }}
          
          ## Downloads
          - **Windows**: GoGame-Windows-${{ github.ref_name }}.zip - Extract and run `run.exe`
          - **Web**: GoGame-Web-${{ github.ref_name }}.zip - Host on any web server
          - **Play Online**: [GitHub Pages](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/)
          
          ## What's Changed
          See the [changelog](https://github.com/${{ github.repository }}/compare/${{ github.ref_name }}...${{ github.ref_name }}) for details.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
